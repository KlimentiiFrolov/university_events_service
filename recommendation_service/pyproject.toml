[project]
name = "recommendation-service"
version = "0.1.0"
description = "gRPC-сервис рекомендаций мероприятий"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68",
    "protobuf>=5.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "grpcio-tools>=1.68",
]

[tool.ruff]
line-length = 100
