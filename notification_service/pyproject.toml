[project]
name = "notification-service"
version = "0.1.0"
description = "RabbitMQ consumer + WebSocket-сервис уведомлений"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=13.0",
    "aio-pika>=9.5",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
