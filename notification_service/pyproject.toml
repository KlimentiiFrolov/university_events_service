[project]
name = "notification-service"
version = "0.1.0"
description = "RabbitMQ consumer + WebSocket-сервис уведомлений"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aio-pika>=9.5",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers>=4.15.0",
    "ruff>=0.15",
]

# Устанавливаемый пакет: в режиме embedded api_service подключает его path-зависимостью
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications"]

[tool.ruff]
line-length = 100
extend-exclude = [
    "src/notifications/alembic/versions",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "-p no:warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
