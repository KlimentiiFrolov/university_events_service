# Заголовок Connection для WebSocket: upgrade, если клиент просит переключить протокол
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_backend {
    server api_service:8000;
}

upstream notification_backend {
    server notification_service:8001;
}

server {
    listen 80;
    server_name _;

    # WebSocket уведомлений -> notification_service
    location /ws/ {
        proxy_pass http://notification_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Соединение может долго молчать между уведомлениями; по умолчанию nginx
        # закрыл бы его через 60 секунд без данных
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Остальное -> api_service
    location / {
        proxy_pass http://api_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
