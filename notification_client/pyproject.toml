[project]
name = "notification-client"
version = "0.1.0"
description = "Console WebSocket client for university event notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
